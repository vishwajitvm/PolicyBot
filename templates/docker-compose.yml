services:
  backend:
    build:
      context: ..
      dockerfile: templates/Dockerfile.backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../data/policies:/app/data/policies
    depends_on:
      - mongodb
      - qdrant
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ..
      dockerfile: templates/Dockerfile.backend
    env_file:
      - ../.env
    volumes:
      - ../data/policies:/app/data/policies
    depends_on:
      - mongodb
      - qdrant
      - redis
    command: python -m app.workers.ingestion_worker

  frontend:
    build:
      context: ..
      dockerfile: templates/Dockerfile.frontend
    env_file:
      - ../.env
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  qdrant_data:
  redis_data:
