services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: policybot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: policybot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    container_name: policybot-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - backend_logs:/app/logs
      - C:/Users/vishw/Downloads/policybot_test_dataset:/app/data/policies
      - ./backend:/app:cached
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - qdrant
      - ollama

  frontend:
    image: node:20-alpine
    container_name: policybot-frontend
    working_dir: /app
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app:cached
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    command: ["sh", "-c", "npm install && npm run dev"]
    depends_on:
      - backend

volumes:
  qdrant_data:
  backend_logs:
  ollama_data:

