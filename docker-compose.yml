services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: policybot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
    container_name: policybot-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - backend_logs:/app/logs
      - C:/Users/vishw/Downloads/policybot_test_dataset:/app/data/policies
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: policybot-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  qdrant_data:
  backend_logs:

